[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "buscador-licitacoes-pncp"
version = "0.1.0"
description = "Busca, filtra e prioriza licitações públicas abertas no PNCP."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mateus Levi Morais Feitosa" }]
dependencies = [
    "requests>=2.31",
    "pandas>=2.1",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
licitacoes = "licitacoes.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
